name: Build App

on:
  schedule:
    - cron: '0 13 * * *' # Once per day at 13:00 UTC, after Flock rebase
  pull_request:
    branches: [master, beta, stable]
  push:
    branches: [master, beta, stable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [master, beta, stable]
    steps:
      - name: Check out the matching demo branch
        uses: actions/checkout@v4
        with:
          # Test proposed changes for their target channel, and the published
          # demo branches for the other channels.
          ref: ${{ github.event_name == 'pull_request' && github.base_ref == matrix.channel && github.ref || matrix.channel }}

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install FVM
        run: dart pub global activate fvm

      - name: Install the published Flock channel
        run: fvm install --verbose

      - name: Check Flock version
        run: fvm flutter --version

      - name: Resolve demo dependencies
        run: fvm flutter pub get

      - name: Analyze demo
        run: fvm flutter analyze --no-pub

      - name: Test demo
        run: fvm flutter test --no-pub

      - name: Build demo for web
        run: fvm flutter build web --release --no-pub
